<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro - Padaria Pão Quente</title>

    <link rel="stylesheet" href="css/reset.css">

    <link rel="stylesheet" href="css/variables.css">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/components.css">

    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>


    <div class="formulario">

        <h2>Criar Conta</h2>


        <form id="formCadastro">


            <input

                type="text"

                id="nome"

                placeholder="Nome"

                autocomplete="name"

                required

            >


            <input

                type="text"

                id="telefone"

                placeholder="Telefone"

                autocomplete="tel"

                required

            >


            <input

                type="email"

                id="email"

                placeholder="Email"

                autocomplete="email"

                required

            >


            <input

                type="password"

                id="senha"

                placeholder="Senha"

                autocomplete="new-password"

                required

            >


            <button type="submit">

                Cadastrar

            </button>


        </form>


        <p>

            Já possui conta?

            <a href="login.html">

                Entrar

            </a>

        </p>


        <p>

            <a href="index.html">

                Voltar para o cardápio

            </a>

        </p>


    </div>


    <script
        type="module"
        src="js/main.js"
    ></script>


</body>

</html>
