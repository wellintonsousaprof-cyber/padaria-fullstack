<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Padaria Pão Quente</title>

    <link rel="stylesheet" href="css/reset.css">

    <link rel="stylesheet" href="css/variables.css">
    
    <link rel="stylesheet" href="css/style.css">
    
    <link rel="stylesheet" href="css/components.css">
    
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- HEADER -->

    <header class="topo">

        <div class="container">

            <div class="logo">

                <img src="imagens/logo.png" alt="Logo">

                <h1>Padaria Pão Quente</h1>

            </div>

            <nav class="menu-superior">

                <ul>

                    <li>

                        <a href="#">Início</a>

                    </li>

                    <li class="dropdown">

                        <a href="#">

                            Categorias

                        </a>

                        <ul id="menuCategorias" class="dropdown-menu">

                            <!-- JS -->

                        </ul>

                    </li>

                </ul>

            </nav>

            <div class="acoes">

                <a href="login.html">

                    Entrar

                </a>

                <button id="btnCarrinho" class="btn">

                    🛒 Carrinho
                
                    <span id="contadorCarrinho">0</span>
                
                </button>

            </div>

        </div>

    </header>

    <!-- BUSCA -->

    <section class="busca">

        <div class="container">

            <input
                type="text"
                id="campoBusca"
                placeholder="Buscar produtos...">

        </div>

    </section>

    <!-- CONTEÚDO -->

    <main class="conteudo">

        <div class="container">

            <!-- VITRINE -->

            <section>

                <h2>

                    Cardápio

                </h2>

                <div id="listaProdutos" class="produtos">

                    <div class="card">

    <img src="https://picsum.photos/300/220" alt="Produto">

    <div class="card-body">

        <h3>Pão Francês</h3>

        <p>Pão francês fresquinho.</p>

        <span class="preco">

            R$ 0,90

        </span>

        <button class="btn">

            Adicionar ao Carrinho

        </button>

    </div>

</div>

                </div>

            </section>

            <!-- CARRINHO -->

            <aside id="carrinho" class="carrinho">

                <button id="fecharCarrinho">
            
                    ✖
            
                </button>
            
            
                <h2>
            
                    Meu Carrinho
            
                </h2>
            
            
                <div id="itensCarrinho">
            
                </div>
            
            
                <div class="total">
            
                    <span>Total:</span>
            
                    <strong id="valorTotal">
            
                        R$ 0,00
            
                    </strong>
            
                </div>
            
            
                <button id="btnFinalizar" class="btn">
            
                    Finalizar Pedido
            
                </button>
            
            
            </aside>

        </div>

    </main>

    

    <footer>

        <p>

            © 2026

            Padaria Pão Quente

        </p>

    </footer>

    <script type="module" src="js/main.js"></script>

</body>

</html>
