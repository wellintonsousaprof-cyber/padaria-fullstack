<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Padaria Pão Quente</title>

    <link rel="stylesheet" href="css/reset.css">

    <link rel="stylesheet" href="css/variables.css">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/components.css">

    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>


    <div class="formulario">

        <h2>Entrar</h2>


        <form id="formLogin">


            <input

                type="email"

                id="email"

                placeholder="E-mail"

                autocomplete="email"

                required

            >


            <input

                type="password"

                id="senha"

                placeholder="Senha"

                autocomplete="current-password"

                required

            >


            <button type="submit">

                Entrar

            </button>


        </form>


        <p>

            Não possui conta?

            <a href="cadastro.html">

                Cadastre-se

            </a>

        </p>


        <p>

            <a href="index.html">

                Voltar para o cardápio

            </a>

        </p>


    </div>


    <script
        type="module"
        src="js/main.js"
    ></script>


</body>

</html>
